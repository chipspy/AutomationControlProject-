<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Main Screen</title>
  <style>
    :root {
      --bg: #101723;
      --panel: #1b2636;
      --panel-light: #243247;
      --text: #f3f7fb;
      --muted: #a9b7c7;
      --primary: #2f80ed;
      --success: #24a148;
      --warning: #f1c21b;
      --danger: #da1e28;
      --danger-dark: #9f141b;
      --border: #38475d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(47, 128, 237, 0.18), transparent 35%),
        var(--bg);
    }

    .main-screen {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      padding: 28px;
      gap: 24px;
    }

    .top-bar,
    .status-panel,
    .control-panel {
      background: rgba(27, 38, 54, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .mode-group,
    .button-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    button,
    .nav-btn {
      border: 0;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover,
    .nav-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active,
    .nav-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .mode-btn {
      min-width: 150px;
      padding: 14px 22px;
      background: var(--panel-light);
      border: 1px solid var(--border);
    }

    .mode-btn.active {
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.22);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: stretch;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      min-height: 420px;
    }

    .section-label {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .operation-btn {
      min-width: 180px;
      padding: 24px 34px;
      font-size: 24px;
    }

    .start {
      background: var(--success);
    }

    .stop {
      background: #6f7785;
    }

    .reset {
      background: var(--warning);
      color: #161616;
    }

    .nav-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: var(--primary);
    }

    .status-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
    }

    .status-title {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 18px;
    }

    .status-value {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 42px;
      font-weight: 800;
    }

    .status-lamp {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 18px rgba(241, 194, 27, 0.65);
    }

    .status-description {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .emo-btn {
      position: fixed;
      right: 34px;
      bottom: 34px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ff6b70 0%, var(--danger) 42%, var(--danger-dark) 100%);
      border: 10px solid #ffccd0;
      color: #fff;
      font-size: 38px;
      line-height: 1.12;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      box-shadow:
        0 0 0 10px rgba(218, 30, 40, 0.22),
        0 20px 42px rgba(0, 0, 0, 0.42);
      z-index: 10;
    }

    .emo-btn:hover {
      filter: brightness(1.12);
      box-shadow:
        0 0 0 14px rgba(218, 30, 40, 0.28),
        0 22px 48px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 900px) {
      .top-bar,
      .content {
        grid-template-columns: 1fr;
      }

      .top-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
      }

      .content {
        display: grid;
      }

      .emo-btn {
        width: 190px;
        height: 190px;
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <main class="main-screen">
    <header class="top-bar">
      <h1 class="title">자동화 설비 Main 화면</h1>
      <div class="mode-group" aria-label="장비 모드 전환">
        <button class="mode-btn active" type="button" data-mode="Auto">자동(Auto)</button>
        <button class="mode-btn" type="button" data-mode="Manual">수동(Manual)</button>
      </div>
    </header>

    <section class="content">
      <div class="control-panel">
        <p class="section-label">Operation Control</p>
        <div class="button-row" aria-label="설비 조작 버튼">
          <button class="operation-btn start" type="button" data-action="Start">시작(Start)</button>
          <button class="operation-btn stop" type="button" data-action="Stop">정지(Stop)</button>
          <button class="operation-btn reset" type="button" data-action="Reset">리셋(Reset)</button>
          <a class="operation-btn nav-btn" href="io_screen.html" aria-label="I/O 모니터 화면으로 이동">I/O 모니터</a>
        </div>
      </div>

      <aside class="status-panel" aria-live="polite">
        <p class="status-title">현재 설비 상태</p>
        <div class="status-value">
          <span id="statusLamp" class="status-lamp"></span>
          <span id="equipmentStatus">Idle</span>
        </div>
        <p id="statusDescription" class="status-description">
          설비가 대기 상태입니다. 실제 PLC 연동 코드는 추후 연결 예정입니다.
        </p>
      </aside>
    </section>

    <button id="emoButton" class="emo-btn" type="button" aria-label="비상정지 버튼">
      비상정지<br />(EMO)
    </button>
  </main>

  <script>
    const modeButtons = document.querySelectorAll(".mode-btn");
    const operationButtons = document.querySelectorAll(".operation-btn[data-action]");
    const equipmentStatus = document.getElementById("equipmentStatus");
    const statusLamp = document.getElementById("statusLamp");
    const statusDescription = document.getElementById("statusDescription");
    const emoButton = document.getElementById("emoButton");

    const statusConfig = {
      Run: {
        color: "#24a148",
        glow: "rgba(36, 161, 72, 0.7)",
        description: "설비가 Run 상태입니다. 더미 동작으로 표시만 변경했습니다."
      },
      Idle: {
        color: "#f1c21b",
        glow: "rgba(241, 194, 27, 0.65)",
        description: "설비가 Idle 상태입니다. 실제 PLC 연동 코드는 추후 연결 예정입니다."
      },
      Alarm: {
        color: "#da1e28",
        glow: "rgba(218, 30, 40, 0.8)",
        description: "설비가 Alarm 상태입니다. 비상정지 또는 알람 더미 동작이 발생했습니다."
      }
    };

    function setStatus(status) {
      const config = statusConfig[status];

      equipmentStatus.textContent = status;
      statusLamp.style.backgroundColor = config.color;
      statusLamp.style.boxShadow = `0 0 18px ${config.glow}`;
      statusDescription.textContent = config.description;

      console.log(`[DUMMY] Equipment status changed to: ${status}`);
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        modeButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");

        const mode = button.dataset.mode;
        console.log(`[DUMMY] Mode changed to: ${mode}`);
        alert(`${mode} 모드로 전환되었습니다. (더미 동작)`);
      });
    });

    operationButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        console.log(`[DUMMY] ${action} button clicked`);

        if (action === "Start") {
          setStatus("Run");
        } else if (action === "Stop" || action === "Reset") {
          setStatus("Idle");
        }

        alert(`${action} 버튼이 눌렸습니다. (더미 동작)`);
      });
    });

    emoButton.addEventListener("click", () => {
      console.warn("[DUMMY] EMO button clicked");
      setStatus("Alarm");
      alert("비상정지(EMO) 버튼이 눌렸습니다. (더미 동작)");
    });
  </script>
</body>
</html>
